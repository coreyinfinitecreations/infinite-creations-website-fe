<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loopGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="50%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FF8A80"/>
    </linearGradient>
    <linearGradient id="loopGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CC3333"/>
      <stop offset="50%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
  </defs>
  
  <!-- Left loop of infinity symbol -->
  <ellipse cx="50" cy="60" rx="35" ry="25" 
           fill="none" 
           stroke="url(#loopGradient1)" 
           stroke-width="8" 
           transform="rotate(-20 50 60)">
    <animate attributeName="stroke-width" 
             values="8;12;8" 
             dur="4s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.8;1;0.8" 
             dur="3s" 
             repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Right loop of infinity symbol -->
  <ellipse cx="150" cy="60" rx="35" ry="25" 
           fill="none" 
           stroke="url(#loopGradient2)" 
           stroke-width="8" 
           transform="rotate(20 150 60)">
    <animate attributeName="stroke-width" 
             values="8;12;8" 
             dur="4s" 
             begin="2s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.8;1;0.8" 
             dur="3s" 
             begin="1.5s"
             repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Center connecting twist -->
  <path d="M 85 60 Q 100 45 115 60 Q 100 75 85 60" 
        fill="none" 
        stroke="url(#loopGradient1)" 
        stroke-width="8" 
        stroke-linecap="round">
    <animate attributeName="stroke-width" 
             values="8;10;8" 
             dur="2s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.9;1;0.9" 
             dur="2.5s" 
             repeatCount="indefinite"/>
  </path>
  
  <!-- Highlight dots for animation -->
  <circle cx="30" cy="50" r="3" fill="url(#loopGradient1)">
    <animate attributeName="r" 
             values="3;5;3" 
             dur="3s" 
             repeatCount="indefinite"/>
    <animateMotion dur="6s" repeatCount="indefinite">
      <path d="M 30 50 Q 50 30 85 60 Q 100 45 115 60 Q 150 30 170 50 Q 150 90 115 60 Q 100 75 85 60 Q 50 90 30 50"/>
    </animateMotion>
  </circle>
  
  <circle cx="170" cy="70" r="3" fill="url(#loopGradient2)">
    <animate attributeName="r" 
             values="3;5;3" 
             dur="3s" 
             begin="3s"
             repeatCount="indefinite"/>
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite">
      <path d="M 170 70 Q 150 90 115 60 Q 100 75 85 60 Q 50 90 30 70 Q 50 30 85 60 Q 100 45 115 60 Q 150 30 170 70"/>
    </animateMotion>
  </circle>
</svg>
